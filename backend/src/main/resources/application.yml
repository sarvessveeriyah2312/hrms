spring:
  application:
    name: hrms-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrms}
    username: ${DB_USER:hrms_app}
    password: ${DB_PASSWORD:hrms_app}
  jackson:
    deserialization:
      # Jackson 3 rejects a missing boolean; clients may leave optional flags out (missing = false).
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      max-file-size: 5MB      # documents (DatabaseFileStore checks again)
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Leave MAIL_HOST unset locally to log emails instead of sending them (or run Mailpit: host localhost, port 1025).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

hrms:
  auth:
    # Access tokens are signed and verified by the identity module (see IdentityConfig);
    # the public key is published at /api/v1/auth/.well-known/jwks.json.
    issuer: hrms-api
    access-token-minutes: 15
    refresh-token-days: 30
    cookie-secure: ${HRMS_COOKIE_SECURE:true}
    # Password reset links from "Forgot password" stay valid this long, and can be asked for this often.
    reset-link-minutes: 30
    reset-requests-per-hour: 3
  web:
    # Where the web app lives; used to build links in emails.
    base-url: ${HRMS_WEB_BASE_URL:http://localhost:5173}
  mail:
    # Sender for emails sent through the platform's server (MAIL_HOST). Companies can set their own server in
    # Company → Email. With neither, emails are written to the log instead.
    from: ${HRMS_MAIL_FROM:HRMS <no-reply@hrms.local>}
    # Company SMTP servers on private or local addresses (and port 1025) are refused, so the settings page can't be
    # used to reach machines inside the network. The local profile allows them for Mailpit.
    allow-private-hosts: false
  secrets:
    # Encrypts stored secrets such as company SMTP passwords: 32 random bytes, base64. Required to save them.
    # Generate one with: openssl rand -base64 32
    key: ${HRMS_SECRET_KEY:}
  seed:
    # Demo company and users for local development only (see application-local.yml).
    enabled: false
  attendance:
    default-geofence-radius-m: 100
    max-client-clock-drift-seconds: 120
    offline-sync-max-age-hours: 72
  firebase:
    # When true, push notifications go through Firebase Cloud Messaging.
    # Credentials come from GOOGLE_APPLICATION_CREDENTIALS (never commit the key file).
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}

logging:
  level:
    com.hrms: INFO
